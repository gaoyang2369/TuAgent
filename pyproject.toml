[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tuagent"
version = "0.3.0"
description = "An asynchronous agent core with pluggable models and tools"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
chat-completions = ["openai>=2,<3"]
mysql = ["PyMySQL[rsa]>=1.1.1,<2"]
manual = ["pypdf>=6,<7"]

[project.scripts]
tuagent-import-manual = "tuagent.manual.importer:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tuagent", "tuagent.*"]
namespaces = false

[tool.setuptools.package-data]
tuagent = ["py.typed"]
